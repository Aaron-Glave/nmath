[tool.pylint.main]
# Match the oldest Python version your project supports.
py-version = "3.13"

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
good-names = ["i", "j", "k", "n", "db", "conn", "x", "y"]