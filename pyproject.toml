[tool.pylint.main]
# Match the oldest Python version your project supports.
py-version = "3.13"
source-roots = ["."]

[tool.pylint.design]
max-args = 6

[tool.pylint.messages_control]
disable = [
    "too-many-branches",
    "too-many-locals",
    "too-many-return-statements",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
module-rgx = "^([a-z_][a-z0-9_]*)$"
good-names = [
    "i", "j", "k", "n", "db", "conn", "x", "y",
    "Prime", "AllPrimesInOrder"
]